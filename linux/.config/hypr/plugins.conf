plugin {
    hyprbars {
        enabled = true
        bar_height = 18
        bar_blur = false

        bar_color = rgb(5384b4)
        # bar_color = rgba(111318ff)
        col.text = rgb(10131a)

        bar_precedence_over_border = true
        bar_part_of_window = true
        bar_text_align = center
        bar_text_size = 14
        bar_text_font = JetBrainsMono Nerd Font Mono Bold

        bar_buttons_alignment = right
        hyprbars-button = rgb(ff5d62), 20, , hyprctl dispatch killactive
        hyprbars-button = rgb(ffd43b), 20, , hyprctl dispatch fullscreen 1
        # hyprbars-button = $color4, 20, , hyprctl dispatch togglefloating

        icon_on_hover = false
        on_double_click = hyprctl dispatch togglefloating
    }
}

windowrule = plugin:hyprbars:nobar, floating:0
windowrule = plugin:hyprbars:nobar, class:^(org.mozilla.firefox)$
