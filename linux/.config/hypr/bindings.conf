# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bindd = ALT SHIFT, T, Terminal, exec, kitty
bindd = ALT SHIFT, Y, Terminal, exec, kitty
bindd = ALT SHIFT, N, Browser, exec, firefox
bind = ALT SHIFT, F8, exec, ~/opt/bin/Mars

bind = $mainMod, R, exec, reload-waybar.sh
bindd = $mainMod, SPACE, launch walker, exec, launch-walker
bindd = $mainMod, U, launch wiremix, exec, launch-wiremix
bindd = $mainMod, I, launch bluetui, exec, launch-bluetui

bind = $mainMod, O, exec, launch-fzf-nvim
bind = $mainMod, P, exec, launch-fzf-dnf
bind = CTRL ALT, E, exec, launch-fzf-edis
bind = $mainMod, W, exec, launch-fzf-wallpaper

bind = CTRL ALT, F, exec, launch-or-focus-tui lf


bind = CTRL ALT, p, exec, hyprpicker
bind = $mainMod, DELETE, exec, hyprctl kill && notify-send "hyprctl kill engaged"

bind = ALT SHIFT, F7, exec, notify-send "test"

bind = ALT SHIFT, SPACE, togglefloating,
bind = ALT SHIFT, RETURN, togglefloating,
# bind = $mainMod, RETURN, fullscreen
bind = $mainMod SHIFT, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

bind = , PRINT, exec, hyprshot -m region --clipboard-only
bind = SHIFT, PRINT, exec, hyprshot -m region
bind = $mainMod, PRINT, exec, hyprshot -m window

bind = SUPER, RETURN, exec, open-in-dropdown "kitty-dropdown" "kitty --class kitty-dropdown"
# bindr = SUPER, SUPER_L, exec, open-in-dropdown "kitty-dropdown" "kitty --class kitty-dropdown"
bind = SUPER, 1, exec, open-in-dropdown "bluetui-dropdown" "kitty --class bluetui-dropdown -e bluetui"
bind = SUPER, 2, exec, open-in-dropdown "wiremix-dropdown" "kitty --class wiremix-dropdown -e wiremix"
bind = SUPER, grave, exec, open-in-dropdown "btop-dropdown" "kitty --class btop-dropdown -e btop"
bind = SUPER, d, exec, open-in-dropdown "discord" "Discord"
bind = SUPER, s, exec, open-in-dropdown "Spotify" "flatpak run com.spotify.Client"

windowrule = workspace special:Spotify, class:Spotify

bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT, 6, workspace, 6
bind = ALT, 7, workspace, 7
bind = ALT, 8, workspace, 8
bind = ALT, 9, workspace, 9
bind = ALT, 0, workspace, 10

bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9
bind = ALT SHIFT, 0, movetoworkspace, 10

binds {
    drag_threshold = 0
}
# mouse:272 is lmb
# mouse:273 is rmb
bindm = ALT, mouse:272, movewindow
# bindm = ALT, mouse:273, movewindow
bindc = ALT, mouse:273, togglefloating
bindc = ALT SHIFT, mouse:273, togglefloating
bindm = ALT SHIFT, mouse:272, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
# bindl = , XF86AudioNext, exec, playerctl next
# bindl = , XF86AudioPause, exec, playerctl play-pause
# bindl = , XF86AudioPlay, exec, playerctl play-pause
# bindl = , XF86AudioPrev, exec, playerctl previous
