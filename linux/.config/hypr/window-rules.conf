# https://wiki.hypr.land/Configuring/Window-Rules/

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*
# Fix some dragging issues with XWayland
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

windowrule = size 75% 75%, class:Spotify
windowrule = workspace 8, class:Spotify
windowrule = float, class:Spotify

windowrule = size 45% 85%, class:edis\.tui\.fzf-nvim
windowrule = size 45% 85%, class:edis\.tui\.fzf-edis
windowrule = size 50% 75%, class:edis\.tui\.fzf-dnf
windowrule = size 50% 30%, class:edis\.tui\.fzf-wallpaper
windowrule = size 35% 40%, class:^(edis\.tui\.wiremix)$
windowrule = size 40% 50%, class:^(edis\.tui\.bluetui)$
windowrule = size 50% 50%, class:^(edis\.tui\..*)$

windowrule = float, class:^(edis\.tui\..*)$
# windowrule = persistentsize, class:^(edis\.tui\..*)$

layerrule = blur,waybar

workspace = w[tv1], gapsout:0 -3 -3 -3, gaspin:0
