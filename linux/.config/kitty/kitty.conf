# https://sw.kovidgoyal.net/kitty/conf/

confirm_os_window_close 0

# https://sw.kovidgoyal.net/kitty/conf/#fonts
font_size 14
# font_family      family="Rec Mono Semicasual"
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# modify_font      cell_height 115%
modify_font      cell_height 115%
modify_font      cell_width 100%

# thin, normal, thick, very thick
# box_drawing_scale 0.1, 1.5, 1.5, 2

# https://sw.kovidgoyal.net/kitty/conf/#text-cursor-customization
cursor_shape               beam
cursor_beam_thickness      3.0
cursor_underline_thickness 3.0
cursor_shape_unfocused     hollow
cursor_trail                 10
cursor_trail_decay           0.1 0.2
cursor_trail_start_threshold 2
cursor_blink_interval 0

# https://sw.kovidgoyal.net/kitty/conf/#window-layout
# initial_window_width  1000
# initial_window_height 1000
remember_window_size  yes
remember_window_position  yes
# placement_strategy bottom-right
# window_margin_width 4
window_padding_width 8 8 2 8
tab_bar_edge top
tab_bar_style slant

# https://sw.kovidgoyal.net/kitty/conf/#performance-tuning
repaint_delay   5
input_delay     2
sync_to_monitor yes

# https://sw.kovidgoyal.net/kitty/conf/#color-scheme
background_opacity 1.0
dynamic_background_opacity yes
background_blur 0

# https://sw.kovidgoyal.net/kitty/conf/#scrollback
scrollbar_interactive   yes
scrollbar_jump_on_click yes
scrollbar_width         1.0
scrollbar_hover_width   1.5
scrollback_pager        nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
touch_scroll_multiplier 1.0
wheel_scroll_multiplier 5.0
wheel_scroll_min_lines 1


# https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts
clear_all_shortcuts no

# https://sw.kovidgoyal.net/kitty/conf/#advanced
shell_integration no-cursor
update_check_interval 0
clone_source_strategies conda,venv,env_var,path
allow_remote_control yes

macos_option_as_alt yes
# hide_window_decorations titlebar-only
hide_window_decorations titlebar-and-corners

map ctrl+shift+o launch --allow-remote-control --type=background kitten @ set-background-opacity --toggle 0.90
# map ctrl+shift+o kitten @ set-background-opacity --toggle 0.8
map ctrl+tab no_op

# map ctrl 1-0 to f13-22
map ctrl+1 send_text all \x1b[25~
map ctrl+2 send_text all \x1b[26~
map ctrl+3 send_text all \x1b[28~
map ctrl+4 send_text all \x1b[29~
map ctrl+5 send_text all \x1b[31~
map ctrl+6 send_text all \x1b[32~
map ctrl+7 send_text all \x1b[33~
map ctrl+8 send_text all \x1b[34~
map ctrl+9 send_text all \x1b[35~
map ctrl+0 send_text all \x1b[36~

# map ctrl+shift+up scroll_line_up smooth

include themes/kanordwa2.conf

map ctrl+m send_key f13
